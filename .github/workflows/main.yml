name: SEO Monitor Daily Check

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 AR
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: data/cache
          key: sitemap-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requirements
        run: pip install requests

      - name: Run monitor
        run: python data/scripts/fetch_and_diff.py

      - name: Upload diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diffs
          path: diffs/
