name: SEO Monitor Daily Check

on:
  schedule:
    - cron: "0 12 * * *"   # Ejecuta todos los días a las 12 UTC
  workflow_dispatch:       # Permite ejecutarlo manualmente

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python requirements
        run: pip install requests

      - name: Run SEO monitor
        run: python scripts/fetch_and_diff.py

      - name: Upload diffs as artifact
        if: always()
        uses: actions/upload-artifact@v4   # ← CAMBIADO
        with:
          name: diffs
          path: diffs/
