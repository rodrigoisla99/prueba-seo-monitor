name: SEO Monitor Daily Check

on:
  schedule:
    # Corre todos los días a las 06:00 AM de Argentina (UTC-3)
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python requirements
        run: pip install requests

      - name: Run SEO monitor
        run: python data/scripts/fetch_and_diff.py

      - name: Upload diffs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffs
          path: diffs/
          
