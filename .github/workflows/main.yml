name: SEO Monitor Daily Check

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore cache (robots/sitemap previos)
        uses: actions/cache@v3
        with:
          path: data/cache
          key: sitemap-cache-v1-${{ github.run_id }}
          restore-keys: sitemap-cache-v1-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run SEO Monitor
        run: python data/scripts/fetch_and_diff.py

      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffs
          path: diffs/
