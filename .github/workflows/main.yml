name: SEO Monitor Daily Check

on:
  schedule:
    - cron: "0 9 * * *"   # corre todos los días a las 09:00 (UTC-3 sería 06:00)
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # CHECKOUT
      # ------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------
      # CACHE (robots/sitemap previos)
      # ------------------------------
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: data/cache
          key: seo-monitor-cache-v2
          restore-keys: |
            seo-monitor-cache-v2

      # ------------------------------
      # PYTHON
      # ------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests

      # ------------------------------
      # RUN SCRIPT
      # ------------------------------
      - name: Run SEO Monitor
        run: python data/scripts/fetch_and_diff.py

      # ------------------------------
      # SAVE DIFFS COMO ARTIFACT
      # ------------------------------
      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffs
          path: diffs/
