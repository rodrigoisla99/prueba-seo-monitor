name: SEO Monitor Daily Check

on:
  schedule:
    - cron: "0 9 * * *"   # Corre todos los días 09:00 AM
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure folders exist
        run: |
          mkdir -p output
          mkdir -p difs
          mkdir -p logs

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            output
            difs
            logs
          key: seo-monitor-cache-${{ github.run_id }}
          restore-keys: seo-monitor-cache-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Run SEO Monitor
        run: python data/scripts/fetch_and_diff.py

      - name: Commit output changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git add output difs logs
            git commit -m "Auto-update SEO monitor outputs and diffs"
            git push
          else
            echo "No changes to commit."
          fi
