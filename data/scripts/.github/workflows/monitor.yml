name: SEO Monitor Daily Check

on:
  schedule:
    - cron: "0 12 * * *"  # Corre todos los días a las 09:00 de Argentina
  workflow_dispatch:      # Permite correrlo manualmente

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests

    - name: Run monitor
      id: run_monitor
      run: |
        python data/scripts/fetch_and_diff.py | tee output.log

    - name: Crear Issue si hubo cambios
      if: contains(steps.run_monitor.outputs, 'Cambio detectado')
      uses: peter-evans/create-issue@v5
      with:
        title: "🚨 Cambios detectados en monitoreo SEO"
        body: |
          El monitoreo detectó cambios en robots.txt o sitemap.xml.
          
          Revisá el historial en la ejecución del workflow.
